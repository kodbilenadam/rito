AllCops:
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 3.2

Layout/LineLength:
  Max: 120
  Exclude:
    - lib/rito/queues.rb

Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false

Naming/VariableNumber:
  Exclude:
    - test/**/*


Lint/EmptyBlock:
  Enabled: false
