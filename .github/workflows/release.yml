name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Test, then publish to RubyGems
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Lint
        run: bundle exec rubocop

      - name: Test
        run: bundle exec rake test
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          GEM_VERSION=$(ruby -r./lib/rito/version -e 'puts Rito::VERSION')
          test "$TAG" = "$GEM_VERSION" || {
            echo "tag v$TAG does not match gem version $GEM_VERSION"
            exit 1
          }

      - name: Leak check
        run: |
          if grep -rn "RGAPI-[0-9a-f]\{8\}-" --include="*.rb" --include="*.yml" . ; then
            echo "possible leaked API key"
            exit 1
          fi

      - uses: rubygems/configure-rubygems-credentials@v2.1.0
        with:
          trusted-publisher: true

      - name: Publish
        run: |
          gem build rito.gemspec
          gem push "rito-$(ruby -r./lib/rito/version -e 'puts Rito::VERSION').gem"

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "rito $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
